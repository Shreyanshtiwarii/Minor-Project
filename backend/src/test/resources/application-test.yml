spring:
  datasource:
    url: jdbc:h2:mem:greenmove;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false

greenmove:
  jwt:
    secret: test-only-jwt-secret-for-automated-tests-32chars
    expiration-ms: 3600000

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.greenmove.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.greenmove.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Allows cleartext/localhost traffic and easier debugging of the WebView
            // during development. See res/xml/network_security_config.xml.
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'

    // Native "Sign in with Google" fallback - Google blocks its GSI web widget
    // inside WebViews, so this uses Android's Credential Manager to get an
    // ID token natively and feeds it to the site's *existing* /auth/google
    // backend endpoint (see GoogleAuthHelper.java). No frontend/backend changes.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
